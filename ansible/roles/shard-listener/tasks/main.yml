---
- name: Create listener system group
  ansible.builtin.group:
    name: "{{ listener_group }}"
    system: true
    state: present

- name: Create listener system user
  ansible.builtin.user:
    name: "{{ listener_user }}"
    group: "{{ listener_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ listener_install_dir }}"
    create_home: false
    state: present

- name: Create listener install directory
  ansible.builtin.file:
    path: "{{ listener_install_dir }}"
    state: directory
    owner: "{{ listener_user }}"
    group: "{{ listener_group }}"
    mode: "0755"

- name: Mark install directory as git safe.directory
  community.general.git_config:
    name: safe.directory
    scope: global
    value: "{{ listener_install_dir }}"

- name: Clone / update shard-listener repository
  ansible.builtin.git:
    repo: "{{ listener_repo }}"
    dest: "{{ listener_install_dir }}"
    version: "{{ listener_version }}"
    force: false
  when: listener_local_binary | default('') | length == 0

- name: Push pre-built listener binary (skips git/build)
  ansible.builtin.copy:
    src: "{{ listener_local_binary }}"
    dest: "{{ listener_install_dir }}/shard-listener"
    owner: "{{ listener_user }}"
    group: "{{ listener_group }}"
    mode: "0755"
  when: listener_local_binary | default('') | length > 0

- name: Set ownership of install directory after clone
  ansible.builtin.file:
    path: "{{ listener_install_dir }}"
    owner: "{{ listener_user }}"
    group: "{{ listener_group }}"
    recurse: true
  when: listener_local_binary | default('') | length == 0

- name: Stat existing listener binary in install dir
  ansible.builtin.stat:
    path: "{{ listener_install_dir }}/shard-listener"
  register: listener_binary_stat
  when: listener_local_binary | default('') | length == 0

- name: Read the installed Go toolchain version
  ansible.builtin.command: "{{ go_install_dir }}/bin/go env GOVERSION"
  environment:
    GOTOOLCHAIN: local
  register: listener_go_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when: listener_local_binary | default('') | length == 0

# A run limited by tags skips the common role, which installs Go. Building
# with another release would miss the pinned toolchain and rebuild every run.
- name: Require the pinned Go toolchain for source builds
  ansible.builtin.assert:
    that:
      - listener_go_installed.stdout | default('') | trim == 'go' ~ go_version
    fail_msg: >-
      {{ go_install_dir }} holds {{ listener_go_installed.stdout | default('no Go') }},
      not go{{ go_version }}. Run the common role first (the play without tags, or with the common tag).
  # A dry run installs nothing, so the toolchain it reads may be the one about to be replaced.
  when:
    - listener_local_binary | default('') | length == 0
    - not ansible_check_mode

- name: Read the Go version the existing binary was built with
  ansible.builtin.command: "{{ go_install_dir }}/bin/go version {{ listener_install_dir }}/shard-listener"
  register: listener_binary_go
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - listener_local_binary | default('') | length == 0
    - listener_binary_stat.stat.exists

- name: Read the release the existing binary was built from
  ansible.builtin.command: "cat {{ listener_install_dir }}/.built-ref"
  register: listener_built_ref
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - listener_local_binary | default('') | length == 0
    - listener_binary_stat.stat.exists

- name: Build shard-listener binary
  ansible.builtin.command:
    # Folded scalar: the one-line form ran past the 160-char lint limit. Folding
    # joins these lines with single spaces, so the command string is unchanged.
    cmd: >-
      {{ go_install_dir }}/bin/go build -buildvcs=false
      -ldflags "-s -w -X github.com/lightwebinc/shard-listener/metrics.Version={{ listener_version }}"
      -o {{ listener_install_dir }}/shard-listener .
    chdir: "{{ listener_install_dir }}"
  environment:
    PATH: "{{ go_install_dir }}/bin:{{ ansible_env.PATH }}"
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    GOOS: "{{ 'freebsd' if ansible_os_family == 'FreeBSD' else 'linux' }}"
    GOARCH: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    HOME: "/tmp"
    GOPATH: "/tmp/gopath"
    GOCACHE: "/tmp/gocache"
  changed_when: true
  when:
    - listener_local_binary | default('') | length == 0
    # A binary built with another Go release, or from another release of the
    # source, is rebuilt: a toolchain move or a version pin move reaches a
    # deployed node without listener_force_build.
    - >-
      not listener_binary_stat.stat.exists
      or (listener_force_build | default(false) | bool)
      or (listener_binary_go.stdout | default('')).split() | last | default('') != 'go' ~ go_version
      or (listener_built_ref.stdout | default('')) | trim != listener_version

- name: Record the release the binary was built from
  ansible.builtin.copy:
    content: "{{ listener_version }}\n"
    dest: "{{ listener_install_dir }}/.built-ref"
    owner: "{{ listener_user }}"
    group: "{{ listener_group }}"
    mode: "0644"
  when: listener_local_binary | default('') | length == 0

- name: Set ownership on pushed/built binary
  ansible.builtin.file:
    path: "{{ listener_install_dir }}/shard-listener"
    owner: "{{ listener_user }}"
    group: "{{ listener_group }}"
    mode: "0755"

- name: Install binary to system bin dir
  ansible.builtin.copy:
    src: "{{ listener_install_dir }}/shard-listener"
    dest: "{{ listener_bin_dir }}/shard-listener"
    remote_src: true
    owner: root
    group: "{{ listener_group }}"
    mode: "0755"
  notify: Restart shard-listener

- name: Create config directory
  ansible.builtin.file:
    path: "{{ '/usr/local/etc' if ansible_os_family == 'FreeBSD' else '/etc/shard-listener' }}"
    state: directory
    owner: root
    group: "{{ listener_group }}"
    mode: "0750"

- name: Deploy environment config file
  ansible.builtin.template:
    src: config.env.j2
    dest: "{{ '/usr/local/etc/shard-listener.conf' if ansible_os_family == 'FreeBSD' else '/etc/shard-listener/config.env' }}"
    owner: root
    group: "{{ listener_group }}"
    mode: "0640"
  notify: Restart shard-listener

- name: Deploy systemd service unit (Linux)
  ansible.builtin.template:
    src: shard-listener.service.j2
    dest: /etc/systemd/system/shard-listener.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family != 'FreeBSD'
  notify:
    - Reload systemd
    - Restart shard-listener

- name: Deploy rc.d service script (FreeBSD)
  ansible.builtin.template:
    src: shard_listener.rc.j2
    dest: /usr/local/etc/rc.d/shard_listener
    owner: root
    group: wheel
    mode: "0755"
  when: ansible_os_family == 'FreeBSD'
  notify: Restart shard-listener

- name: Enable and start shard-listener (Linux)
  ansible.builtin.systemd:
    name: shard-listener
    enabled: true
    state: started
  when: ansible_os_family != 'FreeBSD'

- name: Enable shard-listener in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^shard_listener_enable='
    line: 'shard_listener_enable="YES"'
  when: ansible_os_family == 'FreeBSD'

- name: Start shard-listener (FreeBSD)
  ansible.builtin.service:
    name: shard_listener
    state: started
  when: ansible_os_family == 'FreeBSD'
