---
# Listener receive side. Unlike the ingress proxy (which forwards multicast
# and therefore needs mc_forwarding + ff00::/8 route for the send path), the
# listener only *receives* multicast via MLD group joins. No forwarding is
# needed; we still install a link-scope route so packets match the correct
# interface when kernel selects ingress.

- name: Enable IPv6 forwarding via sysctl (ingress receive is MLD-only; forwarding off)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/60-shard-listener.conf
    reload: true
  loop:
    - { name: net.ipv6.conf.all.accept_ra, value: "1" }
    - { name: "net.ipv6.conf.{{ networking_ingress_iface }}.accept_ra", value: "1" }
    # MLDv2 is required when the listener runs in SSM mode
    # (sourceMode=ssm). Forced for ASM too: harmless and avoids surprises
    # if the operator switches modes later.
    - { name: net.ipv6.conf.all.force_mld_version, value: "2" }
    # Per-socket source-filter cap. Linux default 64 is below production
    # SSM publisher count; raise to networking_mld_max_msf
    # (default 1024 ≈ 2× expected fleet). Required by Posture B/C/D
    # of the SSM Support Plan; no-op in ASM mode.
    - { name: net.ipv6.mld_max_msf, value: "{{ networking_mld_max_msf | default('1024') }}" }

# Ubuntu preinstalls netplan; Debian does not. The role owns its presence so
# the netplan templates below (and `netplan apply`) work on both.
- name: Install netplan (Debian family)
  ansible.builtin.apt:
    name: netplan.io
    state: present
  when: ansible_os_family == 'Debian'

- name: Enable systemd-networkd (netplan renderer backend)
  ansible.builtin.systemd:
    name: systemd-networkd
    enabled: true
    state: started
  when: ansible_os_family == 'Debian'

- name: Deploy netplan config for ethernet ingress
  ansible.builtin.template:
    src: netplan-ethernet.yaml.j2
    dest: /etc/netplan/60-shard-listener.yaml
    owner: root
    group: root
    mode: "0600"
  when: ingress_mode == 'ethernet'
  notify: Apply netplan

- name: Deploy netplan config for GRE6 tunnel ingress
  ansible.builtin.template:
    src: netplan-gre.yaml.j2
    dest: /etc/netplan/61-shard-listener-gre.yaml
    owner: root
    group: root
    mode: "0600"
  when: ingress_mode == 'gre'
  notify: Apply netplan

- name: Deploy BGP VIP netplan config
  ansible.builtin.template:
    src: netplan-vip.yaml.j2
    dest: /etc/netplan/62-shard-listener-vip.yaml
    owner: root
    group: root
    mode: "0600"
  when: enable_bgp | bool and (bgp_vip | length > 0 or bgp_vip6 | length > 0)
  notify: Apply netplan

- name: Apply multicast route on ingress interface (Linux)
  ansible.builtin.command:
    argv:
      - ip
      - -6
      - route
      - replace
      - "{{ networking_mc_route_prefix }}"
      - dev
      - "{{ networking_ingress_iface }}"
  register: networking_mc_route_result
  changed_when: networking_mc_route_result.rc == 0
  failed_when: false
