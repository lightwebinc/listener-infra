---
- name: Deploy shard-listener nodes
  hosts: listener_nodes
  become: true
  gather_facts: true

  # Settings a host can never satisfy fail here, before any role changes it.
  pre_tasks:
    # FreeBSD reserves ff02::/16: rc.d/routing installs "ff02::/16 ::1 -reject"
    # at every boot, so a link-scope multicast route can never be installed.
    # mc_scope link is refused whatever mc_route_prefix says, because the services
    # derive their groups from mc_scope. An mc_route_prefix is compared by value
    # (first group ff02, length 16, in any spelling: ff02::0/16, ff02:0::/16); a
    # narrower ff02 prefix installs and is accepted.
    - name: Refuse link-scope multicast on FreeBSD
      ansible.builtin.assert:
        that:
          - mc_scope != 'link'
          - (mc_route_prefix | default('') | trim | lower) is not match('^ff02:[0-9a-f:.]*/0*16$')
        fail_msg: >-
          mc_scope link, or an mc_route_prefix equal to ff02::/16, cannot be used on
          FreeBSD: it reserves ff02::/16 (rc.d/routing installs "ff02::/16 ::1 -reject"
          at every boot), so the multicast route can never be installed. Use mc_scope
          site (the default), org or global on FreeBSD hosts.
        quiet: true
      when: ansible_os_family == 'FreeBSD'
      tags: [always]

  roles:
    - role: common
      tags: [common]

    - role: perf-tuning
      tags: [perf-tuning]

    - role: shard-listener
      tags: [listener]

    - role: networking
      tags: [networking]

    - role: firewall
      tags: [firewall]
      when: enable_firewall | bool

    - role: bgp
      tags: [bgp]
      when: enable_bgp | bool
